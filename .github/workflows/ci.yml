# CI: lint, typová kontrola, testy proti Postgresu, build Docker obrazu. Běží na každý push a pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, testy, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platforma
          POSTGRES_PASSWORD: platforma
          POSTGRES_DB: platforma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platforma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://platforma:platforma@localhost:5432/platforma_test
      - run: npm run build

  obraz:
    name: Docker obraz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (bez push — registr se nastaví při prvním vydání)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moje-obec/platforma:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
