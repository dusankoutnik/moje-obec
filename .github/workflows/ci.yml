# CI: lint, typová kontrola, audit závislostí, testy s pokrytím proti Postgresu, build Docker obrazu (každý push
# a pull request); smoke test v prohlížeči (Playwright) jen na push do main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, testy, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platforma
          POSTGRES_PASSWORD: platforma
          POSTGRES_DB: platforma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platforma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # známé zranitelnosti závislostí úrovně high a critical shodí build (nižší jen hlásí)
      - run: npm audit --audit-level=high
      # testy s pokrytím; prahy ve vitest.config.ts (jak je zvedat: docs/VYVOJ.md)
      - run: npm run test:pokryti
        env:
          TEST_DATABASE_URL: postgres://platforma:platforma@localhost:5432/platforma_test
      - name: Souhrn pokrytí
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|');for(const k of ['lines','statements','functions','branches'])console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build

  e2e:
    name: Smoke test v prohlížeči
    # prohlížeč je těžký — jen na push do main, ne na každý pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    container:
      # verze musí sedět s @playwright/test v package.json
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platforma
          POSTGRES_PASSWORD: platforma
          POSTGRES_DB: platforma_e2e
        options: >-
          --health-cmd "pg_isready -U platforma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
        env:
          CI: '1'
          HOME: /root
          E2E_DATABASE_URL: postgres://platforma:platforma@postgres:5432/platforma_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  obraz:
    name: Docker obraz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (bez push — registr se nastaví při prvním vydání)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moje-obec/platforma:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
